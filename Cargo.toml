[package]
name = "aa-macro"
version = "0.1.0"
edition = "2021"
description = "Anime Adventures multi-instance macro (clean-room Rust rewrite)"
publish = false

[lib]
name = "aa_macro"
path = "src/lib.rs"

[[bin]]
name = "aa-macro"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Power",
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
