name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/aa-macro.exe dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: aa-macro-windows
          path: dist/
          if-no-files-found: error
      - name: Zip
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath aa-macro-windows.zip -Force
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Built from ${{ github.sha }}. Download aa-macro-windows.zip, unzip, run aa-macro.exe from a terminal (see README).
          prerelease: true
          make_latest: true
          files: aa-macro-windows.zip
