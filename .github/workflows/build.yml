name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      AA_BUILD_SHA: ${{ github.sha }}
      AA_BUILD_NUM: ${{ github.run_number }}
      AA_CHANNEL: ${{ github.ref == 'refs/heads/parallel' && 'parallel' || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/aa-macro.exe dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: aa-macro-windows
          path: dist/
          if-no-files-found: error
      - name: Zip
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/parallel') && github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath aa-macro-windows.zip -Force
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Built from ${{ github.sha }} (build ${{ github.run_number }}). Download aa-macro-windows.zip, unzip, double-click aa-macro.exe. Already installed? The app updates itself (Settings → Updates)." 
          prerelease: true
          make_latest: true
          files: aa-macro-windows.zip
      - name: Publish "parallel" test release
        if: github.ref == 'refs/heads/parallel' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: parallel
          name: Parallel checks test build
          body: "Built from ${{ github.sha }} (build ${{ github.run_number }}). TEST build with parallel placement checks - updates itself from this test channel only."
          prerelease: true
          make_latest: false
          files: aa-macro-windows.zip
